name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: ""
            cc: gcc
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: ""
            cc: aarch64-linux-gnu-gcc
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            suffix: ".exe"
            cc: x86_64-w64-mingw32-gcc
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: ""
            cc: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Install cross-compilers (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-aarch64-linux-gnu

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build all components
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          LDFLAGS="-X main.Version=${VERSION}"
          SUFFIX="${{ matrix.suffix }}"
          OUTDIR="dist/james-${GOOS}-${GOARCH}"
          mkdir -p "${OUTDIR}"

          cd mi6
          go build -ldflags "${LDFLAGS}" -o "../${OUTDIR}/mi6-server${SUFFIX}" ./cmd/mi6-server/
          go build -ldflags "${LDFLAGS}" -o "../${OUTDIR}/mi6-client${SUFFIX}" ./cmd/mi6-client/
          cd ..

          cd moneypenny
          go build -ldflags "${LDFLAGS}" -o "../${OUTDIR}/moneypenny${SUFFIX}" ./cmd/moneypenny/
          if [ "${GOOS}" = "windows" ]; then
            go build -ldflags "${LDFLAGS}" -o "../${OUTDIR}/moneypenny-update-helper.exe" ./cmd/moneypenny-update-helper/
          fi
          cd ..

          cd hem
          go build -ldflags "${LDFLAGS}" -o "../${OUTDIR}/hem${SUFFIX}" ./cmd/hem/
          cd ..

          cd qew
          go build -ldflags "${LDFLAGS}" -o "../${OUTDIR}/qew${SUFFIX}" ./cmd/qew/
          cd ..

      - name: Create archive
        run: |
          cd dist
          DIR="james-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "${DIR}.zip" "${DIR}/"
          else
            tar czf "${DIR}.tar.gz" "${DIR}/"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: james-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/james-${{ matrix.goos }}-${{ matrix.goarch }}.*

  sign-windows:
    needs: build
    runs-on: windows-2022
    environment: artifact-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Windows archive
        uses: actions/download-artifact@v8
        with:
          name: james-windows-amd64
          path: unsigned

      - name: Extract Windows archive
        shell: pwsh
        run: |
          Expand-Archive unsigned\james-windows-amd64.zip -DestinationPath signing -Force

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Register PowerShell Gallery
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }

      - name: Sign Windows executables
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\signing\james-windows-amd64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $signatures = Get-ChildItem signing\james-windows-amd64\*.exe |
            ForEach-Object { Get-AuthenticodeSignature $_ }
          $invalid = $signatures | Where-Object Status -ne Valid
          if ($invalid) {
            $invalid | Format-List Path, Status, StatusMessage
            throw 'One or more Windows executables did not receive a valid Authenticode signature.'
          }

      - name: Create signed Windows archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path signed -Force | Out-Null
          Compress-Archive signing\james-windows-amd64 -DestinationPath signed\james-windows-amd64.zip -Force

      - name: Upload signed Windows archive
        uses: actions/upload-artifact@v7
        with:
          name: james-windows-amd64-signed
          path: signed/james-windows-amd64.zip

  release:
    needs:
      - build
      - sign-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create and sign release manifest
        env:
          JAMES_RELEASE_SIGNING_KEY: ${{ secrets.JAMES_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "${JAMES_RELEASE_SIGNING_KEY}" || {
            echo "JAMES_RELEASE_SIGNING_KEY is not configured" >&2
            exit 1
          }
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib

          root = pathlib.Path("artifacts")
          archives = sorted([
              root / "james-linux-amd64" / "james-linux-amd64.tar.gz",
              root / "james-linux-arm64" / "james-linux-arm64.tar.gz",
              root / "james-darwin-arm64" / "james-darwin-arm64.tar.gz",
              root / "james-windows-amd64-signed" / "james-windows-amd64.zip",
          ])
          if len(archives) != 4:
              raise SystemExit(f"expected 4 release archives, found {len(archives)}")
          missing = [str(path) for path in archives if not path.is_file()]
          if missing:
              raise SystemExit(f"missing release archives: {missing}")
          manifest = {
              "version": "${{ steps.version.outputs.version }}",
              "artifacts": {
                  path.name: hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in archives
              },
          }
          pathlib.Path("james-manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n"
          )
          PY
          printf '%s' "${JAMES_RELEASE_SIGNING_KEY}" | base64 --decode > signing-key
          chmod 600 signing-key
          cat > sign-manifest.go <<'EOF'
          package main

          import (
            "crypto/ed25519"
            "os"
          )

          func main() {
            key, err := os.ReadFile("signing-key")
            if err != nil || len(key) != ed25519.PrivateKeySize {
              panic("invalid signing key")
            }
            manifest, err := os.ReadFile("james-manifest.json")
            if err != nil {
              panic(err)
            }
            if err := os.WriteFile("james-manifest.json.sig", ed25519.Sign(ed25519.PrivateKey(key), manifest), 0644); err != nil {
              panic(err)
            }
          }
          EOF
          GO111MODULE=off go run sign-manifest.go
          rm -f signing-key sign-manifest.go

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: James v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/james-linux-amd64/*.tar.gz
            artifacts/james-linux-arm64/*.tar.gz
            artifacts/james-darwin-arm64/*.tar.gz
            artifacts/james-windows-amd64-signed/*.zip
            james-manifest.json
            james-manifest.json.sig
